name: mondchat_desktop
description: "MondChat 桌面客户端：复用 frontend/app 的界面，Windows 侧实现本机存储与 Turms WebSocket。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  fixnum: ^1.1.0
  mondchat:
    path: ../frontend/app
  turms_client_dart:
    path: ../vendor/turms/turms-client-dart
  # 锁 0.5.x：传统原生插件只在 build windows 时编译原生代码；0.6.x 换成
  # nativeapi，flutter test 也会触发 C 构建，没有 MSVC 的机器连测试都跑不了。
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 与 frontend/app 同一批资源。桌面工程只引用共享包的代码，资源路径必须落在本包内；
  # build.ps1 与 CI 在构建前把 frontend/app/assets 复制到这里（目录不进 git）。
  assets:
    - assets/mondchat-logo.png
    - assets/rocket-open.png
    - assets/rocket-closed.png
    - assets/rocket-launch.png
    - assets/avatars/
