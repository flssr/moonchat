name: mondchat_desktop
description: "MondChat 桌面客户端：复用 frontend/app 的界面，Windows 侧实现本机存储与 Turms WebSocket。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  fixnum: ^1.1.0
  mondchat:
    path: ../frontend/app
  turms_client_dart:
    path: ../vendor/turms/turms-client-dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 与 frontend/app 同一批资源。桌面工程只引用共享包的代码，资源路径必须落在本包内；
  # build.ps1 与 CI 在构建前把 frontend/app/assets 复制到这里（目录不进 git）。
  assets:
    - assets/mondchat-logo.png
    - assets/rocket-open.png
    - assets/rocket-closed.png
    - assets/rocket-launch.png
    - assets/avatars/
