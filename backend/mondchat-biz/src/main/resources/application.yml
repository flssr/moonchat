spring:
  application:
    name: mondchat-biz
  # 库与 Redis 用 Spring 原生键（SPRING_DATASOURCE_* / SPRING_DATA_REDIS_*），
  # 不在 yml 里落默认值：接口测试由 @DynamicPropertySource 注入容器地址。
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${MONDCHAT_BIZ_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: mondchat-biz

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# /v3/api-docs：运行时从 controller 与 DTO 生成，仓库不保存副本。
springdoc:
  # 控制器都没写 produces，默认给 */*；这里压成 json，Apifox 才会按 json 展示示例
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# 自有配置：给 im-facade 与登录凭据用，命名与前缀对应 docs/truth/architecture.md。
mondchat:
  turms:
    # Turms Admin REST（建用户 / 建群 / 代发）。本地编排固定 turms/turms。
    admin-url: ${MONDCHAT_TURMS_ADMIN_URL:http://localhost:8510}
    admin-username: ${MONDCHAT_TURMS_ADMIN_USERNAME:turms}
    admin-password: ${MONDCHAT_TURMS_ADMIN_PASSWORD:turms}
    # 客户端连 /im 的地址：生产是反代域名下的 /im，本地跳过是复用冒烟覆盖文件的 20510。
    gateway-url: ${MONDCHAT_TURMS_GATEWAY_URL:ws://localhost:20510}
    # 与 turms-gateway 共享的 HMAC 密钥文件（Turms 只支持从文件读密钥）。
    jwt-secret-file: ${MONDCHAT_JWT_SECRET_FILE}
    # 客户端 Turms 凭据时长，界面契约见 docs/truth/backend/identity.md。
    credential-ttl: 12h
    # 群投影重放器的扫描间隔（未确认：只为了「失败的群最多晚半分钟收敛」）。
    replay-interval: ${MONDCHAT_TURMS_REPLAY_INTERVAL:30s}
    # 客户端直写开关：默认关闭时只签 QUERY（与切换前一致）；打开后按账号状态签两套 statements。
    # 必须与 `allow-send-messages-to-stranger=false` 同一次切换（docs/truth/backend/identity.md）。
    write-credential-enabled: ${MONDCHAT_TURMS_WRITE_CREDENTIAL_ENABLED:false}
    # Turms 卡死时不能让 Admin 调用无限占线程：超时走既有 catch 回 503，派发器照常退避重试。
    http:
      connect-timeout: ${MONDCHAT_TURMS_HTTP_CONNECT_TIMEOUT:2s}
      read-timeout: ${MONDCHAT_TURMS_HTTP_READ_TIMEOUT:5s}
  auth:
    # 登录 JWT 自签自验，与 Turms 的密钥相互独立。
    jwt-secret: ${MONDCHAT_AUTH_JWT_SECRET}
    login-token-ttl: 7d
  agent:
    # agent 账号密钥的 HMAC pepper（docs/truth/backend/persistence.md）：部署必须显式给出，不给默认值。
    key-pepper: ${MONDCHAT_AGENT_KEY_PEPPER}
  limit:
    # 只作用于 agent 来源的两级桶（好友申请、发言）；速率暂定，见 docs/truth/backend/messaging.md。
    account-per-minute: ${MONDCHAT_LIMIT_ACCOUNT_PER_MINUTE:60}
    conversation-per-minute: ${MONDCHAT_LIMIT_CONVERSATION_PER_MINUTE:20}
    # 注销是 destructive 操作：按账号限制密码确认次数，包含失败尝试。
    account-deletion-per-minute: ${MONDCHAT_LIMIT_ACCOUNT_DELETION_PER_MINUTE:5}
  projection:
    # PG → Turms 读模型的投影（docs/truth/backend/projection.md）。
    # 默认关：P1 只累积事件、不派发，进入 P2 验证 Turms 判定时再打开（打开会一次性派发积压）。
    enabled: ${MONDCHAT_PROJECTION_ENABLED:false}
    dispatch-interval-ms: ${MONDCHAT_PROJECTION_DISPATCH_INTERVAL_MS:2000}
    batch-size: ${MONDCHAT_PROJECTION_BATCH_SIZE:100}
    # 每天 03:00 对账一次；对账只修 Turms，永不反写 PG。
    reconcile-cron: ${MONDCHAT_PROJECTION_RECONCILE_CRON:0 0 3 * * *}
