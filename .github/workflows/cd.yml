name: CD

# 只做后端：push 到 main（用户合完 PR 之后）构建 mondchat-biz 镜像、推 GHCR、上机 pull + up。
# Flutter Web 产物不在这条流水线里，前端与它的反代都在别处。
on:
  push:
    branches: [main]
  # 手动触发：Actions 恢复后不用再推一次 main 就能重新构建并上线（`gh workflow run cd.yml --ref main`）。
  workflow_dispatch:

# 部署串行排队，不取消进行中的那次：半截部署比晚几分钟更糟。
concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      # GHCR 只收小写；仓库所属账号可能带大写。
      - name: 算出镜像名
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mondchat-biz" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/mondchat-biz/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha

      - name: 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 上机 pull + up
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i ~/.ssh/id_deploy infra/prod/compose.yaml "$SSH_USER@$SSH_HOST:/opt/mondchat/compose.yaml"
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            'set -eu; cd /opt/mondchat; docker compose pull; docker compose up -d --wait --wait-timeout 300 --remove-orphans'

      - name: 健康检查
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" 'set -eu
            for _ in $(seq 1 24); do
              if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP; then
                echo "biz 健康检查通过"
                exit 0
              fi
              sleep 5
            done
            echo "biz 两分钟内没起来"
            docker compose -f /opt/mondchat/compose.yaml ps
            exit 1'

  prune:
    # 删不了包就别清，清理失败不能挡住已经上线的部署。
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: 只保留 latest 与最近 3 个 sha
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -eu
          pkg=mondchat-biz
          keep=3
          # 包可能归账号也可能归仓库，哪种能读用哪种
          base="/user/packages/container/$pkg"
          if ! gh api "$base/versions?per_page=1" >/dev/null 2>&1; then
            base="/repos/${GITHUB_REPOSITORY}/packages/container/$pkg"
          fi
          echo "using $base"
          ids=$(gh api "$base/versions?per_page=100" --paginate \
            --jq "[.[] | select((.metadata.container.tags | index(\"latest\")) | not)]
                  | sort_by(.created_at) | reverse | .[$keep:] | .[].id")
          for id in $ids; do
            gh api -X DELETE "$base/versions/$id" >/dev/null
            echo "deleted $id"
          done
