name: 限流插件镜像

# 只做一件事：把 self-hosted 的 Turms 限流插件打进 turms-service 镜像，推到 GHCR。
#
# 为什么不放进 CD：这一跑要编 vendor/turms（约 20 分钟），而 CD 每次 push 到 main 都要跑，
# 不能为插件把后端每次上线都拖慢 20 分钟。这里按路径过滤，只有插件本身、Dockerfile 或
# 这个 workflow 变了才编；vendor 指针变了要手动 `gh workflow run turms-plugin.yml`。
#
# 上线方式：部署机的 /opt/mondchat/.env 设
#   MONDCHAT_TURMS_SERVICE_IMAGE=ghcr.io/<owner>/mondchat-turms-service:latest
# 之后 CD 的 `docker compose pull` 就会拉这个带插件的镜像；不设则仍用上游 pinned digest（无插件）。
on:
  push:
    branches: [main]
    paths:
      - backend/mondchat-turms-plugin/**
      - infra/turms/Dockerfile
      - .github/workflows/turms-plugin.yml
  workflow_dispatch:

concurrency:
  group: turms-plugin
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # vendor/turms 的 turms-service 编一次约 20 分钟，留足余量。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # 插件依赖 vendor/turms 的构件，子模块必须拉下来（CD 那边是不拉的）。
          submodules: recursive

      # GHCR 只收小写；仓库所属账号可能带大写。
      - name: 算出镜像名
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mondchat-turms-service" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/turms/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=turms-plugin
          cache-to: type=gha,mode=max,scope=turms-plugin
