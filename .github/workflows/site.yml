name: Site

# 官网静态页：site/ 推到 main 就铺到服务器 80 端口站点的根目录。
# CD 只做后端镜像；这一条只动 site/，也能手动触发（合并前先试发一次）。
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

# 静态页部署很快，串行排队、不取消进行中的那次：半截替换比晚几秒更糟。
concurrency:
  group: site-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # 站点根目录不写死：用 styles.css 里的固定标语在候选目录里找，找到就说明是同一份官网。
      # 要覆盖就配仓库变量 SITE_ROOT（Settings → Variables）。
      - name: 找站点根目录
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SITE_ROOT_HINT: ${{ vars.SITE_ROOT }}
        run: |
          cat > /tmp/find-root.sh <<'EOF'
          set -eu
          for d in "${SITE_ROOT_HINT:-}" /site /opt/1panel/www /www /var/www; do
            [ -n "$d" ] || continue
            [ -d "$d" ] || continue
            hit=$(grep -rls --include=styles.css 'MondChat official site' "$d" 2>/dev/null | head -n1 || true)
            if [ -n "$hit" ]; then dirname "$hit"; exit 0; fi
          done
          echo '找不到线上 site 根目录；候选目录：' >&2
          ls -la /site 2>/dev/null || true
          ls -la /opt/1panel/www/sites 2>/dev/null || true
          ls -la /www 2>/dev/null || true
          exit 1
          EOF
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "SITE_ROOT_HINT='$SITE_ROOT_HINT' bash -s" < /tmp/find-root.sh \
            | tee /tmp/site-root
          test -s /tmp/site-root
          echo "SITE_ROOT=$(cat /tmp/site-root)" >> "$GITHUB_ENV"

      # 资源地址带内容指纹：CSS/JS 内容一变地址就变，浏览器不会拿旧 CSS 去配新 HTML。
      # 指纹只写在部署时的 index.html 上，仓库里保持裸文件名（本地直接打开也能用）。
      - name: 给静态资源加内容指纹
        run: |
          set -eu
          css=$(sha256sum site/styles.css | cut -c1-10)
          app=$(sha256sum site/app.js | cut -c1-10)
          sky=$(sha256sum site/sky.js | cut -c1-10)
          svg=$(sha256sum site/assets/mondchat-logo.svg | cut -c1-10)
          sed -i \
            -e "s#assets/mondchat-logo.svg#assets/mondchat-logo.svg?v=$svg#g" \
            -e "s#href=\"styles.css\"#href=\"styles.css?v=$css\"#" \
            -e "s#src=\"app.js\"#src=\"app.js?v=$app\"#" \
            -e "s#src=\"sky.js\"#src=\"sky.js?v=$sky\"#" \
            site/index.html
          grep -oE '\?v=[0-9a-f]+' site/index.html | sort -u
          {
            echo "ASSET_CSS=$css"
            echo "ASSET_APP=$app"
            echo "ASSET_SKY=$sky"
            echo "ASSET_SVG=$svg"
          } >> "$GITHUB_ENV"

      # 只覆盖 site/ 里有的文件：不删站点目录里的其它东西（1Panel 自己的入口文件等）。
      # 站点目录是 1Panel 建的、多半归 root；部署账号没有写权限时用免密 sudo 覆盖（没有就明确失败）。
      - name: 同步 site/（资源先铺，index.html 最后）
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # 把解压脚本收成一个函数，两趟各调一次：stdin 留给 tar，不能用来传脚本。
          unpack() {
            ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "set -eu
                if sudo -n true >/dev/null 2>&1; then
                  exec sudo -n tar -xzf - -C '$SITE_ROOT'
                elif [ -w '$SITE_ROOT' ]; then
                  exec tar -xzf - -C '$SITE_ROOT'
                else
                  echo '$SITE_ROOT 不可写，且部署账号没有免密 sudo' >&2
                  exit 1
                fi"
          }
          # 分两趟：先铺资源，再铺 index.html。中途刷新的人不会拿到「新 HTML 指向还没落地的文件」。
          tar -C site -czf - --exclude=./index.html . | unpack
          tar -C site -czf - index.html | unpack
          echo "已铺到 $SITE_ROOT"

      - name: 冒烟：线上文件与部署产物逐字节一致，资源地址带内容指纹
        run: |
          for f in styles.css index.html app.js sky.js; do
            want=$(sha256sum "site/$f" | awk '{print $1}')
            got=$(curl -fsS "https://mondchat.com/$f?t=$(date +%s)" | sha256sum | awk '{print $1}')
            if [ "$want" != "$got" ]; then
              echo "线上 $f 与仓库不一致：$got != $want"
              exit 1
            fi
            echo "$f OK"
          done
          html=$(curl -fsS "https://mondchat.com/?t=$(date +%s)")
          for want in "styles.css?v=$ASSET_CSS" "app.js?v=$ASSET_APP" "sky.js?v=$ASSET_SKY" "mondchat-logo.svg?v=$ASSET_SVG"; do
            if ! printf '%s' "$html" | grep -qF "$want"; then
              echo "线上 index.html 里找不到 $want" >&2
              exit 1
            fi
            echo "$want OK"
          done
