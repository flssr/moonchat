name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 手动触发：Actions 停过一段时间后不必为跑一次再推空提交，PR 分支或 main 都能手点。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      # vendor/turms 是固定提交的子模块，测试不依赖它，不拉取
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      # 客户端也要进门槛：这个 PR 加了 4k+ 行前端，视图坏了不该能合进去。
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # 读通道在 web-only 的 js_interop 里，VM 测试编译不到它；单独加一道 web 构建。
      - run: flutter build web --release

  # 桌面壳独立成包：复用 frontend/app 的界面，只带 Windows 存储与 Turms WebSocket。
  # 它依赖 vendor/turms 里的 Dart proto，所以只有这个 job 拉子模块（Web/后端 job 不拉）。
  desktop:
    # PR 不构建 Windows：这里只是发安装包，不是合并门槛；PR 每次 push 会烧一台 windows-latest 并留下 14.7MB 产物。
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: 同步共享资源
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force assets -ErrorAction SilentlyContinue
          Copy-Item -Recurse ..\frontend\app\assets assets
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # MondChat.exe 在这里出；开发机没有 VS 的 C++ 工作负载，用 artifact 分发。
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: mondchat-windows
          path: desktop/build/windows/x64/runner/Release/
          retention-days: 3
          if-no-files-found: error
