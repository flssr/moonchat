<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MondChat · 月面登陆</title>
<meta name="theme-color" content="#050912" />
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/masks.css" />
</head>
<body class="is-booting">

<!-- ─────────────────────────  icons  ───────────────────────── -->
<svg class="sprite" aria-hidden="true">
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.7 9.7 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-2.7 3.4"/><path d="M6.3 7.9A16 16 0 0 0 2.5 12S6 18 12 18a9.6 9.6 0 0 0 4-.9"/><path d="M9.9 10.1a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m4 11.5 16-6.5-6.5 16-2.6-6.4L4 11.5Z"/><path d="m11 12.5 4.5-4.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><circle cx="9" cy="10" r=".9" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="m15 11 6-3.5v9L15 13"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="m9 4 6 6-1.5 1.5 3.5 5-4.5-1-1 1.5-5-5L8 10 4.5 6.5 9 4Z"/><path d="m9.5 14.5-5 5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-5 4.5 4.5L16 14l4 4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.5c0 4-3.6 7-8 7a9.7 9.7 0 0 1-2.6-.5L5 20l1.2-3.4A6.6 6.6 0 0 1 4 11.5c0-4 3.6-7 8-7s8 3 8 7Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.6a3.2 3.2 0 0 1 0 6.3"/><path d="M17.5 13.6a5.5 5.5 0 0 1 3 5.4"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5.2-5.2 2 2-5.2 5.2-2Z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.4-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3L12 5v14l-5-4.5H4Z"/><path d="M16 8.6a5 5 0 0 1 0 6.8"/><path d="M18.7 6a9 9 0 0 1 0 12"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3L12 5v14l-5-4.5H4Z"/><path d="m16.5 9.5 5 5m0-5-5 5"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.4l3.4 2"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 13.7 9l5.5 1.7-5.5 1.7L12 18l-1.7-5.6L4.8 10.7 10.3 9 12 3.5Z"/></symbol>
</svg>

<!-- ─────────────────────────  sky  ───────────────────────── -->
<div class="sky" id="sky">
  <div class="sky__base"></div>
  <canvas class="sky__stars" id="stars" aria-hidden="true"></canvas>
  <div class="nebula nebula--1"></div>
  <div class="nebula nebula--2"></div>
  <div class="nebula nebula--3"></div>

  <div class="moon" id="moon" aria-hidden="true">
    <div class="moon__halo"></div>
    <div class="moon__disc">
      <span class="crater c1"></span><span class="crater c2"></span><span class="crater c3"></span>
      <span class="crater c4"></span><span class="crater c5"></span>
      <span class="moon__shade"></span>
    </div>
  </div>

  <div class="horizon"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>

<div class="warp" id="warp" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<!-- ─────────────────────────  scene  ───────────────────────── -->
<main class="scene" id="scene">
  <header class="brand">
    <img class="brand__logo" src="assets/logo.svg" alt="MondChat" width="44" height="44" />
    <span class="brand__text"><strong>MondChat</strong></span>
  </header>

  <button class="sound" id="soundBtn" type="button" aria-pressed="true" title="声音：开">
    <svg class="ico"><use href="#i-sound"/></svg>
    <span class="sound__slash"></span>
  </button>

  <div class="layout">
    <section class="intro">
      <p class="eyebrow"><i></i>Welcome to MondChat</p>
      <h1>欢迎来到<span class="grad">月读世界</span></h1>

      <form class="panel" id="loginForm" novalidate autocomplete="on">
        <div class="panel__sheen" aria-hidden="true"></div>

        <label class="field" id="fieldEmail">
          <span class="field__icon"><svg class="ico"><use href="#i-mail"/></svg></span>
          <span class="field__body">
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
                   placeholder=" " spellcheck="false" aria-label="邮箱" />
            <span class="field__label">邮箱</span>
          </span>
          <span class="field__tick"><svg class="ico"><use href="#i-check"/></svg></span>
        </label>

        <label class="field" id="fieldPass">
          <span class="field__icon"><svg class="ico"><use href="#i-lock"/></svg></span>
          <span class="field__body">
            <input id="password" name="password" type="password" autocomplete="current-password"
                   placeholder=" " aria-label="密码" />
            <span class="field__label">密码</span>
          </span>
          <button class="field__eye" id="eyeBtn" type="button" aria-label="显示密码" tabindex="0">
            <svg class="ico ico--eye"><use href="#i-eye"/></svg>
            <svg class="ico ico--eye-off"><use href="#i-eye-off"/></svg>
          </button>
          <button class="field__go" id="goBtn" type="submit" aria-label="登舱" tabindex="-1">
            <svg class="ico"><use href="#i-arrow"/></svg>
          </button>
        </label>

        <p class="panel__error" id="error" role="alert"></p>

        <div class="panel__foot">
          <a class="register" href="#" id="registerLink">注册账号</a>
        </div>
      </form>
    </section>

    <section class="rocket-stage" id="rocketStage" aria-hidden="true">
      <div class="stage__halo"></div>
      <div class="stage__orbit"></div>
      <div class="rocket" id="rocket">
        <div class="rocket__art" id="rocketArt">
          <img class="rocket__img rocket__img--open" src="assets/rocket-open.png" alt="" draggable="false" />
          <img class="rocket__img rocket__img--leaf" id="doorLeaf" src="assets/rocket-open.png" alt="" draggable="false" />
        </div>
        <img class="rocket__img rocket__img--launch" id="launchImg" src="assets/rocket-launch.png" alt="" draggable="false" />
        <div class="rocket__closed" id="closedLayer" aria-hidden="true">
          <img class="closed__patch" id="framePatch" src="assets/rocket-closed.png" alt="" draggable="false" />
          <img class="closed__wipe" id="wipeLayer" src="assets/rocket-closed.png" alt="" draggable="false" />
        </div>

        <div class="doorway" id="doorway">
          <span class="doorway__light"></span>
          <span class="doorway__beam"></span>
        </div>

        <button class="enter" id="enterBtn" type="button">
          <span class="enter__ring"></span>
          <span class="enter__label">登 录</span>
        </button>

        <span class="thruster" id="thruster"></span>
      </div>

      <div class="stage__ground"><span></span></div>
      <div class="stage__dust" id="dust"></div>
    </section>
  </div>

  <footer class="foot" aria-hidden="true"></footer>
</main>

<!-- ─────────────────────────  chat  ───────────────────────── -->
<section class="app" id="app" aria-hidden="true" aria-label="MondChat 聊天主页">
  <div class="app__frame">

    <aside class="rail">
      <div class="rail__logo" title="MondChat">
        <img src="assets/logo.svg" alt="MondChat" />
      </div>

      <nav class="rail__nav">
        <button class="rail__btn is-active" type="button" data-tip="消息"><svg class="ico"><use href="#i-chat"/></svg><i class="rail__dot"></i></button>
        <button class="rail__btn" type="button" data-tip="联系人"><svg class="ico"><use href="#i-users"/></svg></button>
        <button class="rail__btn" type="button" data-tip="探索"><svg class="ico"><use href="#i-compass"/></svg></button>
        <button class="rail__btn" type="button" data-tip="设置"><svg class="ico"><use href="#i-settings"/></svg></button>
      </nav>

      <div class="rail__bottom">
        <button class="rail__btn" type="button" id="replayBtn" data-tip="重新登舱"><svg class="ico"><use href="#i-logout"/></svg></button>
        <button class="rail__avatar" type="button" title="你">你</button>
      </div>
    </aside>

    <aside class="sidebar">
      <div class="sidebar__head">
        <h2>消息 <span class="count" id="convCount">6</span></h2>
        <button class="icon-btn" type="button" id="newChatBtn" aria-label="新对话"><svg class="ico"><use href="#i-plus"/></svg></button>
      </div>

      <label class="search">
        <svg class="ico"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" placeholder="搜索月面频道" aria-label="搜索会话" />
      </label>

      <div class="tabs" role="tablist">
        <button class="tab is-active" role="tab" data-filter="all">全部</button>
        <button class="tab" role="tab" data-filter="unread">未读 <i>2</i></button>
        <button class="tab" role="tab" data-filter="group">群组</button>
      </div>

      <div class="convs" id="convList"></div>

      <div class="sidebar__me">
        <span class="avatar avatar--me">你</span>
        <span class="sidebar__me-txt"><b>访客宇航员</b><em>月面基地 · A-07 舱</em></span>
        <span class="status-dot"></span>
      </div>
    </aside>

    <section class="room">
      <header class="room__head">
        <div class="room__id">
          <span class="avatar avatar--lg" id="roomAvatar">🌙</span>
          <div class="room__meta">
            <h3 id="roomName">月面基地 · Luna</h3>
            <p id="roomStatus"><span class="status-dot"></span>在线 · 第 3 号舷窗</p>
          </div>
        </div>
        <div class="room__actions">
          <button class="icon-btn" type="button" aria-label="语音通话"><svg class="ico"><use href="#i-phone"/></svg></button>
          <button class="icon-btn" type="button" aria-label="视频通话"><svg class="ico"><use href="#i-video"/></svg></button>
          <button class="icon-btn is-active" type="button" id="infoBtn" aria-label="会话信息"><svg class="ico"><use href="#i-info"/></svg></button>
        </div>
      </header>

      <div class="room__body" id="msgList">
        <div class="day"><span>今天 · 登舱第 1 天</span></div>
      </div>

      <div class="composer">
        <div class="composer__box">
          <button class="icon-btn" type="button" aria-label="附件"><svg class="ico"><use href="#i-plus"/></svg></button>
          <textarea id="msgInput" rows="1" placeholder="发一条消息给 Luna…" aria-label="输入消息"></textarea>
          <button class="icon-btn emoji-btn" type="button" id="emojiBtn" aria-label="表情"><svg class="ico"><use href="#i-smile"/></svg></button>
          <button class="send" id="sendBtn" type="button" disabled aria-label="发送">
            <svg class="ico"><use href="#i-send"/></svg>
          </button>
          <div class="emoji-pop" id="emojiPop" hidden></div>
        </div>
        <p class="composer__hint">Enter 发送 <span>·</span> Shift + Enter 换行</p>
      </div>
    </section>

    <aside class="info" id="infoPanel">
      <div class="info__head">
        <span>会话信息</span>
        <button class="icon-btn" type="button" id="infoClose" aria-label="关闭"><svg class="ico ico--flip"><use href="#i-chevron"/></svg></button>
      </div>

      <div class="info__profile">
        <span class="avatar avatar--xl" id="infoAvatar">🌙</span>
        <b id="infoName">Luna</b>
        <em>月面基地 · 频道主理人</em>
        <div class="info__chips"><span>在线</span><span>已认证</span></div>
      </div>

      <div class="info__row">
        <button class="info__action" type="button"><svg class="ico"><use href="#i-bell"/></svg><span>免打扰</span><i class="switch"></i></button>
        <button class="info__action" type="button"><svg class="ico"><use href="#i-pin"/></svg><span>置顶会话</span><i class="switch is-on"></i></button>
      </div>

      <div class="info__section">
        <h4>共享星图 <span>3</span></h4>
        <div class="shots">
          <button class="shot" type="button"><img src="assets/rocket-closed.png" alt="座驾" /></button>
          <button class="shot shot--moon" type="button"><span></span></button>
          <button class="shot shot--sky" type="button"><span></span></button>
        </div>
      </div>

      <div class="info__section">
        <h4>舱位数据</h4>
        <dl class="stats">
          <div><dt>轨道高度</dt><dd>384,400 km</dd></div>
          <div><dt>舱位编号</dt><dd>A-07</dd></div>
          <div><dt>信号延迟</dt><dd>1.28 s</dd></div>
        </dl>
      </div>

      <p class="info__note">你与 Luna 的对话已端到端加密，仅在这片月面上存在。</p>
    </aside>
  </div>
</section>

<div class="flash" id="flash" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="boot" id="boot">
  <span class="boot__moon"></span>
  <p>正在对接月面基地…</p>
</div>

<script src="js/app.js" defer></script>
</body>
</html>
