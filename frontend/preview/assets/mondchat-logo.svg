  <!-- Robot antenna -->
  <path d="M364 223 V203" fill="none" stroke="#5146C9" stroke-width="9" stroke-linecap="round"/>
  <circle cx="364" cy="194" r="11" fill="#5146C9"/>

  <!-- Robot head -->
  <rect x="306" y="224" width="116" height="82" rx="34" fill="url(#botBlue)"/>
  <rect x="298" y="244" width="16" height="40" rx="8" fill="#5146C9"/>
  <rect x="414" y="244" width="16" height="40" rx="8" fill="#5146C9"/>
  <circle cx="338" cy="265" r="10" fill="#FFFFFF"/>
  <circle cx="390" cy="265" r="10" fill="#FFFFFF"/>
