# 冒烟用的临时覆盖文件，不是部署配置。
# 它只把 turms-gateway 的身份认证切成 JWT 模式，让 infra/turms/smoke 能验证：
#   「Biz 签的 JWT 能登录」与「只授 QUERY 的凭据发不出消息」。
# 三条属性对应 docs/messaging-and-tunnel.md 的「凭据与客户端权限」：
#   type = jwt；HMAC 密钥从文件读（Turms 只支持 file/p12，不收内联字符串）；
#   type != PASSWORD 时 gateway 不查用户库，所以「Turms 用户不存密码」也成立。

services:
  redis:
    # 本机 6379 常被别的 compose 项目占着；Turms 走 compose 网络里的 redis:6379，
    # 冒烟不需要占宿主端口。ports 是列表，用 !override 替换掉基础文件里的映射。
    ports: !override
      - "16379:6379"

  turms-gateway:
    environment:
      TURMS_GATEWAY_SESSION_IDENTITYACCESSMANAGEMENT_TYPE: jwt
      TURMS_GATEWAY_SESSION_IDENTITYACCESSMANAGEMENT_JWT_ALGORITHM_HMAC256_FILEPATH: /opt/turms/secrets/jwt-hmac256.key
    volumes:
      - ${MOONCHAT_JWT_SECRET_FILE:?请先设置 MOONCHAT_JWT_SECRET_FILE 为密钥文件的绝对路径}:/opt/turms/secrets/jwt-hmac256.key:ro
    # 宿主 10510 在本机被占（EADDRINUSE），冒烟只需要 WS 通，换到 20510。
    # ports 是列表，用 !override 替掉基础文件里的那条映射。
    ports: !override
      - "20510:10510"
